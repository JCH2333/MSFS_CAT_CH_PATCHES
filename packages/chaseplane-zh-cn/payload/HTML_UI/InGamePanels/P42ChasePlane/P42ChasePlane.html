	<style>
		body {
			transition: none !important;
		}

		html body #loading_screen svg {
			width: 8em;
			animation: loading_screen_zoom 2s 0.1s ease-out forwards !important;
		}

		html body #loading_screen svg path {
			stroke-dasharray: 1000;
			stroke-dashoffset: 1000;
			stroke-width: 0.1em;
			stroke: #FFFFFF;
			fill: transparent;
			animation: loading_screen_draw 2s 0.1s ease-out forwards !important;
		}

		html body #loading_screen svg path.s1 {
			animation-delay: 0.2s;
		}

		html body #loading_screen svg path.s2 {
			animation-delay: 0.4s;
		}

		html body #loading_screen svg path.s3 {
			animation-delay: 0.6s;
		}

		html body #loading_screen svg path.s4 {
			animation-delay: 0.8s;
		}

		@keyframes loading_screen_zoom {
			to {
				transform: scale(1.3);
			}
		}

		@keyframes loading_screen_draw {
			to {
				stroke-dashoffset: 0;
			}
		}

		html body #loading_screen .status {
			position: absolute;
			bottom: 2em;
			left: 50%;
			opacity: 0;
			transform: translateX(-50%);
		}

		html body #loading_screen .status.visible {
			opacity: 1;
			transition: opacity 0.5s;
		}

		html body #loading_screen .status .status_missing {
			font-size: 0.58em;
			line-height: 1.35;
			text-align: center;
			color: #ffb1b1;
			white-space: pre-line;
			margin-bottom: 0.55em;
		}

		html body #loading_screen .status .status_dots {
			display: flex;
			justify-content: center;
			align-items: center;
			flex-wrap: wrap;
		}

		html body #loading_screen .status .status_dots div {
			display: inline-block;
			width: 0.4em;
			height: 0.4em;
			border-radius: 50%;
			background: var(--color, #330000);
			margin: 0.1em;
			transition: background 0.5s;
		}
	</style>

	<script>
		document.addEventListener("DOMContentLoaded", () => {

			setTimeout(() => {

				if (!document.body.classList.contains("ready")) {

					// set visible on status
					document.querySelector(".loading_screen .status").classList.add("visible");

					// update status
					let status_check_interval;
					status_check_interval = setInterval(() => {
						let status = [
							{ label: "Camera mode", value: SimVar.GetSimVarValue("CAMERA STATE", "Enum"), check: (x) => { return x == 2; } },
							{ label: "Toolbar", value: SimVar.GetSimVarValue("L:p42_cp_load_toolbar", "Number"), check: (x) => { return x; } },
							{ label: "Overlay", value: SimVar.GetSimVarValue("L:p42_cp_load_overlay", "Number"), check: (x) => { return x; } },
							{ label: "Authentication", value: SimVar.GetSimVarValue("L:p42_cp_load_auth1", "Number"), check: (x) => { return x == 1 || x == 2; } },
							{ label: "Hook state", value: SimVar.GetSimVarValue("L:p42_cp_load_hooked", "Number"), check: (x) => { return x; } },
							{ label: "Camera definitions", value: SimVar.GetSimVarValue("L:p42_cp_load_camera_defs", "Number"), check: (x) => { return x; } },
							{ label: "Cloud sync", value: SimVar.GetSimVarValue("L:p42_cp_load_cloud_sync", "Number"), check: (x) => { return x; } },
							{ label: "Vehicle", value: SimVar.GetSimVarValue("L:p42_cp_load_vehicle", "Number"), check: (x) => { return x; } },
							{ label: "Eyepoint", value: SimVar.GetSimVarValue("L:p42_cp_load_eyepoint", "Number"), check: (x) => { return x; } },
							{ label: "Groups library", value: SimVar.GetSimVarValue("L:p42_cp_load_groups_lib", "Number"), check: (x) => { return x; } },
							{ label: "Views library", value: SimVar.GetSimVarValue("L:p42_cp_load_views_lib", "Number"), check: (x) => { return x; } },
							{ label: "Flight data", value: SimVar.GetSimVarValue("L:p42_cp_load_flight", "Number"), check: (x) => { return x; } },
						];

						let status_divs = document.querySelectorAll(".loading_screen .status .status_dots div");
						let missing_items = [];
						for (let i = 0; i < status_divs.length; i++) {
							const status_div = status_divs[i];
							const status_item = status[i];
							const v = status_item.check(status_item.value);

							if(v) {
								status_div.style.setProperty('--color', '#00FF00');
							} else {
								status_div.style.setProperty('--color', '#bb0000');
								missing_items.push(status_item.label);
							}

						}

						const missing_status_div = document.querySelector(".loading_screen .status .status_missing");
						if (missing_status_div) {
							missing_status_div.textContent = missing_items.join("\n");
						}

						// if body.ready, stop interval
						if (document.body.classList.contains("ready")) {
							clearInterval(status_check_interval);
						}
					}, 1000);
				}

			}, 8000);

		});
	</script>
